<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Modular</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>Práctica/h2>
        <ul>
            <li><a href="#" data-modulo="tareas">Tareas</a></li>
            <li><a href="#" data-modulo="calculadora">Calculadora</a></li>
        </ul>
    </nav>
    <main class="content">
        <div id="tareas" class="modulo activo">
            <h1>Gestión de Tareas</h1>
            <input type="text" id="nuevaTarea" placeholder="Nueva tarea">
            <button onclick="agregarTarea()">Agregar</button>
            <ul id="listaTareas"></ul>
        </div>
        <div id="calculadora" class="modulo">
            <h1>Calculadora</h1>
            <input type="number" id="num1" placeholder="Número 1" max="9" maxlength="1">
            <select id="operacion">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>
            <input type="number" id="num2" placeholder="Número 2" max="9" maxlength="1">
            <button onclick="calcular()">Calcular</button>
            <p id="resultado"></p>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
